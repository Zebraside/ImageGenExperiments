# LoRA fine-tuning of Stable Diffusion 2.1 base at 256x256.
# Load + override from the CLI, e.g.:
#   uv run python -m imagegen.train --config configs/lora_sd21.yaml train.max_steps=2
#
# Any leaf can be overridden with dotlist args (foo.bar=value).

seed: 42

model:
  key: sd21                                      # registry key (see imagegen.models.factory)
  base_model: Manojb/stable-diffusion-2-1-base   # mirror of stabilityai/stable-diffusion-2-1-base (orig repo is private/deprecated)
  image_size: 256

lora:                                            # used only when train.mode == lora
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, to_out.0]

data:
  root: /workspace/data/ffhq256                  # produced by scripts/prepare_dataset.py
  batch_size: 16                                 # lower (e.g. 4) for full fine-tune
  num_workers: 4
  limit: null                                    # cap #images (smoke tests / overfit)

train:
  mode: lora                                     # lora | full
  optimizer: adamw                               # adamw | adamw_8bit (8-bit needs bitsandbytes; mainly for full FT)
  accumulate_grad_batches: 1                     # effective batch = batch_size * this
  grad_checkpointing: false                      # set true for full FT on 24 GB cards
  lr: 1.0e-4                                      # use ~1e-5 for full fine-tune
  max_steps: 2000
  max_epochs: null                               # set one of max_steps / max_epochs
  trigger_prompt: "a woman with dark hair"  # fallback when an image has no sidecar .txt caption (see scripts/caption_dataset.py)
  mixed_precision: bf16                          # bf16 | fp16 | fp32
  gradient_clip_val: 1.0
  output_dir: /workspace/outputs/lora_sd21
  ckpt_every_n_steps: 500
  sample_every_n_steps: 250
  num_samples: 4
  sample_steps: 25
  guidance_scale: 7.5

logging:
  wandb_project: imagegen                        # set to null to disable W&B (uses CSV logger)
  log_every: 50
