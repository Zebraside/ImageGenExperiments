# Full fine-tuning of Stable Diffusion 2.1 base at 512x512 (the whole UNet is trained).
# 512 is SD 2.1 base's native resolution. Heavier than LoRA, but targets 16 GB VRAM via
# grad checkpointing + 8-bit AdamW + bf16 frozen VAE/text encoder. Versus 256, the latents
# are 4x the spatial area (64x64 vs 32x32), so activation memory roughly quadruples and the
# old 256 batch (16) OOMs. Gradient accumulation gives an effective batch of 32
# (data.batch_size 4 * accumulate_grad_batches 8) with no extra VRAM (the micro-batch stays
# 4); max_steps 6500 ~= 3 passes over the ~70k images (69.5k train / 32 per step ~= 2170/epoch). The
# run's VRAM peak at 512 is the periodic sample pass, not training -- it is generated one
# image at a time (see lit_module.generate) so num_samples doesn't blow it up. Measured peak
# ~15.6/16 GB on an RTX 2000 Ada (tight). To raise the effective batch, increase
# accumulate_grad_batches (effective batch = data.batch_size * train.accumulate_grad_batches).
# A held-out validation split (data.val_size) drives best-checkpoint selection by val/loss.
#
#   uv run python -m imagegen.train --config configs/full_sd21.yaml

seed: 42

model:
  key: sd21
  base_model: Manojb/stable-diffusion-2-1-base   # mirror of stabilityai/stable-diffusion-2-1-base (orig repo is private/deprecated)
  image_size: 512

lora:                                            # ignored when train.mode == full
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, to_out.0]

data:
  root: /workspace/data/ffhq512                  # produced by scripts/prepare_dataset.py
  batch_size: 4                                  # 512 latents are 4x the 256 area; 4 fits 16 GB (peak is the sample pass)
  num_workers: 4
  limit: null
  val_size: 512                                  # images held out (excluded from training) for val/loss checkpoint selection; null disables

train:
  mode: full
  optimizer: adamw_8bit                          # bitsandbytes 8-bit AdamW; cuts optimizer state ~6.9 GB -> ~1.7 GB
  accumulate_grad_batches: 8                      # effective batch = data.batch_size * this = 32; no extra VRAM (micro-batch stays 4), only wall-clock
  grad_checkpointing: true
  lr: 1.0e-5                                       # baseline for the effective batch of 32; a real batch supports a higher lr than the noisy batch-4 setting did
  lr_schedule: cosine                            # warmup then cosine decay; curbs late-step weight drift (vs. constant)
  lr_warmup_steps: 200
  ema: true                                      # EMA of UNet weights; sampled/saved from instead of raw weights (~3.4 GB extra VRAM)
  ema_decay: 0.9999                               # over the ~6.5k-step (3-epoch) run this has time to warm up and smooth the final weights
  snr_gamma: 5.0                                  # min-SNR-gamma loss weighting (null disables); balances per-timestep loss scales
  max_steps: 6500                                 # optimizer steps; ~3 epochs at effective batch 32 (see header)
  max_epochs: null
  trigger_prompt: "a high-quality photo of a person's face"  # fallback when an image has no sidecar .txt caption (see scripts/caption_dataset.py)
  cond_dropout_prob: 0.1                          # fraction of captions dropped to the null prompt each step, so CFG has a trained unconditional
  mixed_precision: bf16
  gradient_clip_val: 1.0
  output_dir: /workspace/outputs/full_sd21
  ckpt_every_n_steps: 500                         # only used if val_size is null; with a val split, checkpointing follows the val cadence
  val_check_interval: 4000                        # Lightning counts this in micro-batches, not optimizer steps: 4000 / accumulate_grad_batches(8) = every 500 optimizer steps
  val_seed: 0                                     # deterministic noise/timesteps for a comparable val/loss
  sample_every_n_steps: 500
  num_samples: 4
  sample_steps: 50                                # more steps -> samples reflect weights, not sampler artifacts
  guidance_scale: 4.0                             # lower guidance reduces small-feature (eye/gaze) artifacts

logging:
  wandb_project: imagegen
  log_every: 50
