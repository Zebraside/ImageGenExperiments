# Full fine-tuning of Stable Diffusion 2.1 base at 256x256 (the whole UNet is trained).
# Heavier than LoRA, but fits 16 GB VRAM thanks to grad checkpointing + 8-bit AdamW +
# bf16 frozen VAE/text encoder. Measured peak (RTX 2000 Ada, 16 GB):
#   ~9 GB static, +~0.04 GB/image -> batch 16 ~9.5 GB, 32 ~10.1 GB, 48 ~11.8 GB, 64 OOMs.
# batch_size 16 leaves ample headroom for the periodic sample callback's inference pass.
# Effective batch = data.batch_size * train.accumulate_grad_batches.
#
#   uv run python -m imagegen.train --config configs/full_sd21.yaml

seed: 42

model:
  key: sd21
  base_model: Manojb/stable-diffusion-2-1-base   # mirror of stabilityai/stable-diffusion-2-1-base (orig repo is private/deprecated)
  image_size: 256

lora:                                            # ignored when train.mode == full
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, to_out.0]

data:
  root: /workspace/data/ffhq256                  # produced by scripts/prepare_dataset.py
  batch_size: 16                                 # ~9.5 GB measured; up to ~48 fits if you want larger micro-batches
  num_workers: 4
  limit: null

train:
  mode: full
  optimizer: adamw_8bit                          # bitsandbytes 8-bit AdamW; cuts optimizer state ~6.9 GB -> ~1.7 GB
  accumulate_grad_batches: 2                      # effective batch = batch_size * this (= 32)
  grad_checkpointing: true
  lr: 1.0e-5
  max_steps: 5000
  max_epochs: null
  trigger_prompt: "a high-quality photo of a person's face"  # fallback when an image has no sidecar .txt caption (see scripts/caption_dataset.py)
  mixed_precision: bf16
  gradient_clip_val: 1.0
  output_dir: /workspace/outputs/full_sd21
  ckpt_every_n_steps: 1000
  sample_every_n_steps: 500
  num_samples: 4
  sample_steps: 25
  guidance_scale: 7.5

logging:
  wandb_project: imagegen
  log_every: 50
