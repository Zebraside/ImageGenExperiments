# Experiment 8 -- LPIPS aux at half weight: identical to exp5 (LoRA + AlexNet LPIPS
# aux on decoded predicted-x0 vs the real image) except aux_lpips_weight is 0.05
# instead of 0.1. At 800 steps w=0.1 still over-textured the output; this run tests
# whether a gentler perceptual nudge preserves fidelity without the artifacts. The
# aux term runs on 1 sample (256px) every 2 steps.
#   uv run python -m imagegen.train --config configs/exp8_lora_lpips_low.yaml

seed: 42

model:
  key: sd21
  base_model: Manojb/stable-diffusion-2-1-base
  image_size: 512

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, to_out.0]

data:
  root: /workspace/data/ffhq512
  batch_size: 4                                  # smaller than exp2 (8): the in-graph VAE decode + perceptual backward needs the VRAM headroom
  num_workers: 4
  limit: null
  val_size: 512

train:
  mode: lora
  optimizer: adamw
  accumulate_grad_batches: 2                       # micro-batch 4 x 2 = effective batch 8 (matches the other runs)
  grad_checkpointing: true
  lr: 1.0e-4
  loss_type: l2
  max_steps: 2000                                 # fixed budget: 2000 optimizer steps for every experiment
  max_epochs: null
  num_sanity_val_steps: 0
  trigger_prompt: "a high-quality photo of a person's face"
  mixed_precision: bf16
  gradient_clip_val: 1.0
  output_dir: /workspace/outputs/exp8_lora_lpips_low
  ckpt_every_n_steps: 500
  val_check_interval: 800                          # micro-batches; /accumulate(2) = every 400 optimizer steps
  val_seed: 0
  sample_every_n_steps: 200
  num_samples: 4
  sample_steps: 30
  guidance_scale: 5.0
  # --- LPIPS auxiliary perceptual loss (half weight) ---
  aux_lpips_weight: 0.05                           # half of exp5's 0.1 -- the variable under test
  aux_lpips_net: alex                             # same backbone as exp5
  aux_every_n_steps: 2
  aux_max_samples: 1

logging:
  wandb_project: imagegen
  run_name: lora-lpips-alex-w05-2k
  log_every: 50
