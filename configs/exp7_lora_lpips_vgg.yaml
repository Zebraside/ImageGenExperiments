# Experiment 7 -- LPIPS aux with the VGG backbone: identical to exp5 (LoRA + LPIPS
# aux on decoded predicted-x0 vs the real image) except the perceptual net is VGG
# instead of AlexNet. At 800 steps the AlexNet LPIPS injected high-frequency texture
# artifacts even at w=0.1; this run isolates the LPIPS backbone to test whether that
# was an AlexNet artifact. The aux term still runs on 1 sample (256px) every 2 steps,
# so VGG fits 16 GB at batch 4.
#   uv run python -m imagegen.train --config configs/exp7_lora_lpips_vgg.yaml

seed: 42

model:
  key: sd21
  base_model: Manojb/stable-diffusion-2-1-base
  image_size: 512

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, to_out.0]

data:
  root: /workspace/data/ffhq512
  batch_size: 4                                  # smaller than exp2 (8): the in-graph VAE decode + perceptual backward needs the VRAM headroom
  num_workers: 4
  limit: null
  val_size: 512

train:
  mode: lora
  optimizer: adamw
  accumulate_grad_batches: 2                       # micro-batch 4 x 2 = effective batch 8 (matches the other runs)
  grad_checkpointing: true
  lr: 1.0e-4
  loss_type: l2
  max_steps: 2000                                 # fixed budget: 2000 optimizer steps for every experiment
  max_epochs: null
  num_sanity_val_steps: 0
  trigger_prompt: "a high-quality photo of a person's face"
  mixed_precision: bf16
  gradient_clip_val: 1.0
  output_dir: /workspace/outputs/exp7_lora_lpips_vgg
  ckpt_every_n_steps: 500
  val_check_interval: 800                          # micro-batches; /accumulate(2) = every 400 optimizer steps
  val_seed: 0
  sample_every_n_steps: 200
  num_samples: 4
  sample_steps: 30
  guidance_scale: 5.0
  # --- LPIPS auxiliary perceptual loss (VGG backbone) ---
  aux_lpips_weight: 0.1                            # same weight as exp5; the only change vs exp5 is the backbone
  aux_lpips_net: vgg                              # vgg instead of alex -- the variable under test
  aux_every_n_steps: 2
  aux_max_samples: 1

logging:
  wandb_project: imagegen
  run_name: lora-lpips-vgg-2k
  log_every: 50
