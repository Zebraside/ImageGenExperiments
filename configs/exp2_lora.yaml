# Experiment 2 -- Switch to LoRA: adapter fine-tune of SD 2.1 base @ 512, L2 loss.
# Same ~1500-step budget, trigger prompt, seed, and sampling params as exp1 so the
# full-FT vs LoRA comparison is apples-to-apples. Defines the LoRA baseline that
# exps 5 (LPIPS) and 6 (ArcFace) extend.
#   uv run python -m imagegen.train --config configs/exp2_lora.yaml

seed: 42

model:
  key: sd21
  base_model: Manojb/stable-diffusion-2-1-base
  image_size: 512

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: [to_q, to_k, to_v, to_out.0]

data:
  root: /workspace/data/ffhq512
  batch_size: 8
  num_workers: 4
  limit: null
  val_size: 512                                  # held-out split so val/loss is logged like exp1

train:
  mode: lora
  optimizer: adamw
  accumulate_grad_batches: 1
  grad_checkpointing: true
  lr: 1.0e-4
  loss_type: l2
  max_steps: 2000                                 # fixed budget: 2000 optimizer steps for every experiment
  max_epochs: null
  num_sanity_val_steps: 0
  trigger_prompt: "a high-quality photo of a person's face"
  mixed_precision: bf16
  gradient_clip_val: 1.0
  output_dir: /workspace/outputs/exp2_lora
  ckpt_every_n_steps: 500
  val_check_interval: 400                         # accumulate=1 -> micro-batches == optimizer steps; val at 400/800/1200/1600/2000
  val_seed: 0
  sample_every_n_steps: 200
  num_samples: 4
  sample_steps: 30
  guidance_scale: 5.0

logging:
  wandb_project: imagegen
  run_name: lora-r32-l2-2k
  log_every: 50
