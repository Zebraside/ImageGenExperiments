[project]
name = "imagegen"
version = "0.1.0"
description = "Image generation deep learning model training pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "diffusers>=0.38.0",
    "hf-transfer>=0.1.9",
    "lightning>=2.4.0",
    "litlogger>=2026.5.12",
    "omegaconf>=2.3.1",
    "peft>=0.13.0",
    "pillow>=10.0.0",
    "pyarrow>=24.0.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.12.0",
    "wandb>=0.27.2",
]

[project.scripts]
imagegen-train = "imagegen.train:main"
imagegen-overfit = "imagegen.overfit:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
